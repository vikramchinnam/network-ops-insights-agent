[project]
name = "network-ops-insights-agent"
version = "0.7.0"
description = "AI agent on Snowflake for an enterprise networking customer base (synthetic data)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "snowflake-snowpark-python[pandas]>=1.30",
    "numpy>=1.26",
    "faker>=30.0",
    "pyyaml>=6.0",
    "pyjwt>=2.8",
    "requests>=2.31",
    "dbt-snowflake>=1.10,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "fastapi>=0.115",      # chat app (spcs/app); the container pins exact versions in spcs/requirements.txt
    "uvicorn>=0.30",
    "httpx>=0.27",         # FastAPI test client
]

[tool.ruff]
line-length = 110

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snowpark/src/noi_snowpark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"   # avoids Windows temp-folder permission errors
