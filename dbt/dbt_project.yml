name: network_ops
version: "0.2.0"
config-version: 2
profile: network_ops

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  network_ops:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
    search:
      +materialized: table
      +schema: search
    semantic:
      +materialized: semantic_view   # from the Snowflake-Labs/dbt_semantic_view package
      +schema: semantic
      +copy_grants: true             # keep grants when dbt replaces the view
      +persist_docs:                 # descriptions live in the DDL (COMMENT, WITH SYNONYMS)
        relation: false
        columns: false
