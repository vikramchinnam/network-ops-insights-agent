# Cortex Agent specification (template).
#
# deploy_agent.py fills in the DATABASE and WAREHOUSE placeholders for the target environment and runs:
#   CREATE OR REPLACE AGENT <database>.AGENTS.NETWORK_OPS_AGENT FROM SPECIFICATION <this file>
#
# Design notes:
# - Three tools. Search is split into KnowledgeBase and CaseHistory over the same service with
#   different filters, because Stage 4 showed support cases crowd out articles.
# - Model names change over time; keep the orchestration model here, in one place.

models:
  orchestration: claude-sonnet-4-5

orchestration:
  budget:
    seconds: 90
    tokens: 32000

instructions:
  system: >
    You are the Network Ops Insights assistant for an enterprise networking vendor. You help
    support engineers, customer success managers and partners understand network health, support
    cases, firmware issues and renewals across a customer base of hospitals, schools, universities,
    retailers, hotels, factories, government offices and stadiums. The data is synthetic.

  orchestration: >
    Use NetworkMetrics for any question that needs numbers: counts, averages, totals, rankings,
    trends, uptime, failures, cases by category or severity, renewals and contract value.
    Use KnowledgeBase for known issues, fixes, workarounds, firmware release notes, end of sale and
    design guidance.
    Use CaseHistory to find past support cases that resemble a problem. When a question asks what
    cases are about, or asks to describe them, use CaseHistory for the case descriptions in addition
    to any counts or categories from NetworkMetrics.
    For "why" or "what should we do" questions, use NetworkMetrics to establish the facts, then
    KnowledgeBase for the explanation or fix. Do not guess numbers; get them from NetworkMetrics.
    If a question is unrelated to networking, support cases or renewals, say you can't help with it
    and do not call any tools.

  response: >
    Lead with the direct answer in one or two sentences, then supporting detail. Lead with the direct answer in one or two sentences, then supporting detail. Whenever you use
    KnowledgeBase, always write the document ID in the answer text, for example "(KB-1001)" or
    "(RN-AP-10.3.0)", so readers can look it up. Round averages and
    percentages to two decimals and show currency in US dollars. If the data can't answer the
    question, say so plainly instead of guessing.

  sample_questions:
    - question: Which access point firmware version has the most roaming failures?
    - question: Is there a known fix for roaming failures on firmware 10.2.1?
    - question: Which customers renewing in the next 90 days have open critical cases?
    - question: What should we replace the AX-200 with?

tools:
  - tool_spec:
      type: cortex_analyst_text_to_sql
      name: NetworkMetrics
      description: >
        Answers quantitative questions about customers, sites, devices, daily device health
        (uptime, disconnects, roaming and authentication failures), support case metrics
        (counts, severity, resolution time) and subscriptions (renewals, annual contract value).

  - tool_spec:
      type: cortex_search
      name: KnowledgeBase
      description: >
        Searches knowledge base articles and firmware release notes: known issues, fixes,
        workarounds, upgrade guidance, end-of-sale notices and Wi-Fi design best practices.

  - tool_spec:
      type: cortex_search
      name: CaseHistory
      description: >
        Searches individual support case descriptions to find similar past problems and what
        customers reported.

tool_resources:
  NetworkMetrics:
    semantic_view: ${DATABASE}.SEMANTIC.NETWORK_OPS_ANALYTICS
    execution_environment:
      type: warehouse
      warehouse: ${WAREHOUSE}

  KnowledgeBase:
    name: ${DATABASE}.SEARCH.SUPPORT_DOCS
    max_results: "5"
    id_column: doc_id
    title_column: title
    filter:
      "@or":
        - "@eq":
            doc_type: kb_article
        - "@eq":
            doc_type: release_note

  CaseHistory:
    name: ${DATABASE}.SEARCH.SUPPORT_DOCS
    max_results: "5"
    id_column: doc_id
    title_column: title
    filter:
      "@eq":
        doc_type: support_case
